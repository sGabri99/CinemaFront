<div class="gestione-staff-container">
    <div class="form-card">
        <h2>Nuovo Membro Staff</h2>

        <div *ngIf="messaggioSuccesso" class="alert alert-success">
            {{ messaggioSuccesso }}
        </div>
        <div *ngIf="messaggioErrore" class="alert alert-danger">
            {{ messaggioErrore }}
        </div>

        <form [formGroup]="staffForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" formControlName="nome" placeholder="Inserisci il nome">
            </div>

            <div class="form-group">
                <label>Cognome</label>
                <input type="text" formControlName="cognome" placeholder="Inserisci il cognome">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="nome@cinemaaurora.it">
            </div>

            <div class="form-group">
                <label>Ruolo</label>
                <select formControlName="ruolo">
                    <option value="" disabled selected>Seleziona un ruolo</option>
                    <option value="STAFF">Staff (Dipendente)</option>
                    <option value="SUPERADMIN">Super Admin (Amministratore)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Telefono <span class="opzionale">(Opzionale)</span></label>
                <input type="text" formControlName="telefono" placeholder="Inserisci il numero di telefono">
            </div>

            <button type="submit" class="btn-submit">REGISTRA MEMBRO STAFF</button>
        </form>
    </div>
</div>
