<div class="container mt-5 text-light">
    <div class="bg-dark p-4 rounded-4 shadow mb-4">
        <h2 class="mb-3 text-uppercase fw-bold text-danger">Ricerca Film & Importazione Catalogo</h2>
        <p class="text-muted small">Cerca i titoli elaborati dal server per importarli nel catalogo ufficiale del cinema.</p>

        <div class="input-group">
            <input type="text" class="form-control bg-secondary text-white border-0 py-3"
                   [(ngModel)]="stringaRicerca" placeholder="Scrivi il titolo del film (es. Interstellar)..."
                   (keyup.enter)="ricerca()">
            <button class="btn btn-danger px-4" (click)="ricerca()">CERCA</button>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        @for (f of filmTrovati; track f.imdbId) {
            <div class="col">
                <div class="card h-100 bg-dark text-white border border-secondary rounded-4 overflow-hidden">
                    <div style="aspect-ratio: 2/3; overflow: hidden; background-color: #222;">
                        <img [src]="f.poster && f.poster !== 'N/A' ? f.poster : 'https://via.placeholder.com/300x450?text=No+Poster'"
                             class="w-100 h-100 object-fit-cover" alt="Poster Film">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="fw-bold mb-1 text-truncate">{{ f.title}}</h5>
                            <p class="text-muted small mb-3">Anno: {{ f.year}}</p>
                        </div>
                        <button class="btn btn-outline-danger w-100 fw-bold text-uppercase small py-2"
                                (click)="aggiungi(f)">
                            Aggiungi Film
                        </button>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
