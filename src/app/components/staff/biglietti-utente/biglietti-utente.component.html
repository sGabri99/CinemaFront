<div class="container mt-5 text-black bg-dark p-4 rounded-4 shadow">
    <h2 class="mb-4 text-uppercase fw-bold text-danger">Biglietti Utente</h2>

    <div class="row g-3 align-items-center mb-4">
        <div class="col-md-8">
            <input type="number" class="form-control bg-secondary text-white border-0 py-2.5"
                   [(ngModel)]="idUtenteCercato" placeholder="Inserisci ID Utente">
        </div>
        <div class="col-md-4">
            <button class="btn btn-danger w-100 py-2.5 fw-bold" (click)="cerca()">Cerca Biglietti</button>
        </div>
    </div>

    @if (biglietti.length > 0) {
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
                <thead>
                <tr class="text-danger">
                    <th>ID Biglietto</th>
                    <th>Nome Utente</th>
                    <th>ID Spettacolo</th>
                    <th class="text-end">Azioni</th>
                </tr>
                </thead>
                <tbody>
                    @for (b of biglietti; track b.id) {
                        <tr>
                            <td><span class="badge bg-secondary">#{{ b.id }}</span></td>
                            <td>{{ b.nomeUtente }}</td>
                            <td>
                <span class="text-warning">
                  <i class="bi bi-film me-1"></i> Spettacolo ID: {{ b.idSpettacolo }}
                </span>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-danger" (click)="cancellaBiglietto(b.id)">
                                    <i class="bi bi-trash me-1"></i> Annulla Biglietto
                                </button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    } @else {
        <p class="text-muted text-center py-4">Nessun biglietto trovato per questo utente.</p>
    }
</div>
