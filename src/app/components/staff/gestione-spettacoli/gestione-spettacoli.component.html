<div class="container mt-5 text-light">
    <div class="row g-4">

        <div class="col-lg-4">
            <div class="bg-dark p-4 rounded-4 shadow border border-secondary">
                <h4 class="mb-3 text-uppercase fw-bold text-danger">Nuovo Spettacolo</h4>
                <form [formGroup]="formSpettacolo" (ngSubmit)="salvaSpettacolo()">

                    <div class="mb-3">
                        <label class="form-label small text-muted">ID Film</label>
                        <input type="number" formControlName="idFilm" class="form-control bg-secondary text-white border-0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">ID Sala</label>
                        <input type="number" formControlName="idSala" class="form-control bg-secondary text-white border-0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Data</label>
                        <input type="date" formControlName="data" class="form-control bg-secondary text-white border-0">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-muted">Ora Inizio</label>
                            <input type="time" formControlName="oraInizio" class="form-control bg-secondary text-white border-0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-muted">Ora Fine</label>
                            <input type="time" formControlName="oraFine" class="form-control bg-secondary text-white border-0">
                        </div>
                    </div>

                    <button type="submit" [disabled]="formSpettacolo.invalid" class="btn btn-danger w-100 fw-bold py-2 mt-2">
                        Aggiungi Spettacolo
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="bg-dark p-4 rounded-4 shadow">
                <h4 class="mb-4 text-uppercase fw-bold text-white">Programmazione Attiva</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                        <tr class="text-danger small text-uppercase">
                            <th>#</th>
                            <th>Film</th>
                            <th>Sala</th>
                            <th>Data</th>
                            <th>Orario (Inizio - Fine)</th>
                            <th>Posti Liberi</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                        </thead>
                        <tbody>
                            @for (s of spettacoli; track s.id) {
                                <tr>
                                    <td><span class="text-muted">#{{ s.id }}</span></td>
                                    <td><strong class="text-white">{{ s.nomeFilm }}</strong></td>
                                    <td><span class="badge bg-secondary">{{ s.nomeSala }}</span></td>
                                    <td>{{ s.data }}</td>
                                    <td>
                    <span class="text-warning">
                      <i class="bi bi-clock me-1"></i> {{ s.oraInizio }} - {{ s.oraFine }}
                    </span>
                                    </td>
                                    <td>
                    <span [class]="s.postiRimanenti > 20 ? 'text-success fw-bold' : 'text-danger fw-bold'">
                      {{ s.postiRimanenti }} posti
                    </span>
                                    </td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-danger" (click)="elimina(s.id)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
