<div class="container my-4">
    <h2>Gestione film</h2>

    <!-- Banner di successo: appare solo dopo inserimento film -->
    @if (filmInserito) {
        <div class="alert-success">
            <span class="alert-icon">✓</span>
            Film inserito con successo!
        </div>
    }

    <a class="btn btn-primary mb-3" routerLink="/inserisci-film">+ Nuovo film</a>

    <table class="table">
        <thead>
        <tr>
            <th>Titolo</th>
            <th>Durata</th>
            <th>Generi</th>
            <th>Azioni</th>
        </tr>
        </thead>
        <tbody>
            @for(film of films; track film.id) {
                <tr>
                    <td>{{ film.titolo }}</td>
                    <td>{{ film.durata }}</td>
                    <td>{{ film.nomeGeneri }}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" (click)="elimina(film.id)">Elimina</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
