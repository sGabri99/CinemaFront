<header class="cinema-header">
  <div class="cinema-navbar">
    <a class="logo" routerLink="/home">Cinema Aurora</a>

    <nav class="nav-links" aria-label="Navigazione principale">
      <a routerLink="/home">Home</a>
      <a routerLink="/lista-film">Film</a>
      <a routerLink="/lista-spettacoli">Spettacoli</a>
      <div class="account-menu">
        <button type="button" class="account-trigger" aria-haspopup="true">
          Account
          <span class="chevron">&#9662;</span>
        </button>
        <div class="account-dropdown" role="menu">
          @if (isLoggedIn()) {
            <a routerLink="/profilo" role="menuitem">Profilo</a>
            <button type="button" role="menuitem" (click)="logout()">Logout</button>
          } @else {
            <a routerLink="/login" role="menuitem">Login</a>
            <a routerLink="/registrazione" role="menuitem">Registrazione</a>
          }
        </div>
      </div>
    </nav>
  </div>
</header>
