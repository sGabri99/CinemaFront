<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">

            <div class="text-center mb-4">
        <span class="brand-logo">
          <i class="bi bi-film text-pri me-2"></i>Cinema Aurora
        </span>
                <h4 class="text-white fw-bold mt-3 mb-1">Recupera password</h4>
                <p class="small text-sec">Inserisci la tua email e ti invieremo un codice di recupero</p>
            </div>

            @if (inviata) {
                <div class="alert alert-success d-flex align-items-center gap-2 rounded-3" role="alert">
                    <i class="bi bi-envelope-check-fill fs-5"></i>
                    <div>
                        <strong>Email inviata!</strong>
                        <div class="small">Se l'email è registrata, riceverai un codice di recupero.</div>
                    </div>
                </div>
                <p class="text-center mt-3">
                    <a routerLink="/password-reset" class="text-pri fw-semibold text-decoration-none">
                        <i class="bi bi-arrow-right me-1"></i>Inserisci il codice ricevuto
                    </a>
                </p>
            }

            @if (!inviata) {
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-sec">EMAIL</label>
                    <input type="email" class="form-control auth-input" placeholder="nome@esempio.com" [(ngModel)]="email" />
                </div>

                <button class="btn btn-danger w-100 btn-auth fw-bold" (click)="invia()" [disabled]="loading">
                    @if (loading) {
                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        Invio in corso...
                    } @else {
                        <i class="bi bi-send me-2"></i>Invia email di recupero
                    }
                </button>

                <p class="text-center small mt-4 mb-0 text-sec">
                    Ricordi la password?
                    <a routerLink="/login" class="text-pri fw-semibold text-decoration-none ms-1">Accedi</a>
                </p>
            }
        </div>
    </div>
</div>
