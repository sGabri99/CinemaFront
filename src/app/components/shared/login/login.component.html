<div class="auth-page">
    <div class="auth-container">

        <div class="auth-card">
            <!-- Logo / Brand -->
            <div class="text-center mb-4">
        <span class="brand-logo">
          <i class="bi bi-film text-danger me-2"></i>Cinema Aurora
        </span>
                <h4 class="text-white fw-bold mt-3 mb-1">Bentornato</h4>
                <p class="text-muted small">Accedi al tuo account per prenotare i tuoi spettacoli</p>
            </div>

            <!-- Errore -->
            @if (errore) {
                <div class="alert alert-danger d-flex align-items-center gap-2 py-2 rounded-3 mb-3" role="alert">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span class="small">{{ errore }}</span>
                </div>
            }

            <!-- Form -->
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">EMAIL</label>
                <input
                        type="email"
                        class="form-control auth-input"
                        placeholder="nome@esempio.com"
                        [(ngModel)]="dto.email"
                        (keyup.enter)="login()"
                        autocomplete="email"
                />
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-muted small fw-semibold mb-0">PASSWORD</label>
                    <a routerLink="/password-dimenticata" class="text-danger small text-decoration-none">Password dimenticata?</a>

                </div>
                <div class="position-relative">
                    <input
                            [type]="mostraPassword ? 'text' : 'password'"
                            class="form-control auth-input pe-5"
                            placeholder="••••••••"
                            [(ngModel)]="dto.password"
                            (keyup.enter)="login()"
                            autocomplete="current-password"
                    />
                    <button
                            type="button"
                            class="btn-toggle-pwd"
                            (click)="mostraPassword = !mostraPassword"
                            [title]="mostraPassword ? 'Nascondi' : 'Mostra'"
                    >
                        <i class="bi" [class.bi-eye]="!mostraPassword" [class.bi-eye-slash]="mostraPassword"></i>
                    </button>
                </div>
            </div>

            <button
                    class="btn btn-danger w-100 btn-auth fw-bold"
                    (click)="login()"
                    [disabled]="loading"
            >
                @if (loading) {
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Accesso in corso...
                } @else {
                    <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
                }
            </button>

            <div class="divider my-4">
                <span>oppure</span>
            </div>

            <p class="text-center text-muted small mb-0">
                Non hai un account?
                <a routerLink="/registrazione" class="text-danger fw-semibold text-decoration-none ms-1">Registrati</a>
            </p>


        </div>

    </div>
</div>
